case 'goto':goto(ix);return;
case 'speak':speak(id);return;
case 'intro':{let was=st.introShown.includes(id);if(!was){st.introShown.push(id);xp(5);if(st.introShown.length===6)done(0)}else{speak(id)}break}
case 'intro-reset':st.introShown=[];break;
case 'flip':st.cardFlip=!st.cardFlip;break;
case 'known':if(!st.known.includes(id)){st.known.push(id);xp(6);if(st.known.length===15)done(1)}else st.known=st.known.filter(x=>x!==id);persist();break;
case 'card-prev':st.cardIdx=(st.cardIdx+14)%15;st.cardFlip=false;break;
case 'card-shuffle':st.cardOrder=shuffle(P.map(x=>x.id));st.cardIdx=0;st.cardFlip=false;break;
case 'card-next':if(st.cardIdx===14){done(1);goto(2);return}st.cardIdx++;st.cardFlip=false;break;
case 'choice-hint':{if(!st.choice)initChoice();st.choice.hint=true;break}
case 'choice-answer':{const g=st.choice;if(!g||g.completed)return;const correct=g.list[g.idx];if(id!==correct){if(!g.wrong.includes(id)){g.wrong.push(id);g.first=false}g.lastWrong=true}else{if(g.first){g.correct++;xp(15)}else xp(4);g.idx++;g.wrong=[];g.hint=false;g.lastWrong=false;g.first=true;if(g.idx===15){g.completed=true;done(2)}speak(correct)}break}
case 'match-l':{let g=st.match;if(!g||g.solved.includes(id))return;g.selectedL=id;checkMatch();return}
case 'match-r':{let g=st.match;if(!g||g.solved.includes(id))return;g.selectedR=id;checkMatch();return}
case 'match-next':{const g=st.match;if(g.solved.length!==5)return;if(g.round===2){g.finished=true}else{g.round++;matchRound()}break}
case 'build-add':{let g=st.build;if(!g||g.verified)return;let at=g.bank.findIndex(x=>x.index===ix);if(at!==-1){g.built.push(g.bank.splice(at,1)[0]);g.error=false}break}
case 'build-remove':{let g=st.build;if(!g||g.verified)return;let t=g.built.splice(ix,1)[0];if(t)g.bank.push(t);g.error=false;break}
case 'build-clear':{let g=st.build;if(!g||g.verified)return;g.bank=shuffle([...g.bank,...g.built]);g.built=[];g.error=false;break}
case 'build-hint':st.build.hint=true;break;
case 'build-check':{let g=st.build;if(!g||g.verified)return;const correct=P[g.ids[g.idx]].kk.split(' ');if(g.built.length===correct.length&&g.built.every((x,i)=>x.word===correct[i])){g.verified=true;xp(12);g.correct++;speak(g.ids[g.idx])}else g.error=true;break}
case 'build-next':{let g=st.build;if(!g.verified)return;g.idx++;if(g.idx===g.ids.length){g.finished=true;done(4)}else buildNew();break}
case 'sim-hint':st.sim.hint=true;break;
case 'sim-answer':{let g=st.sim;let correct=SIMS[g.idx].id;if(id===correct){if(!g.wrong.length)xp(15);else xp(5);g.correct++;g.idx++;g.wrong=[];g.hint=false;g.lastWrong=false;speak(correct);if(g.idx===SIMS.length){g.finished=true;done(5)}}else{if(!g.wrong.includes(id))g.wrong.push(id);g.lastWrong=true}break}
case 'race-mode':st.raceMode=Number(el.dataset.n);break;
case 'race-start':startRace();return;
case 'race-answer':submitRace(id);return;
case 'race-next':raceNext();return;
case 'race-reset':st.race=null;st.raceMode=1;clearInterval(raceInterval);break;
case 'reset-all':resetAll();return;
}
render();
});
function renderTime(){let s=Math.floor((Date.now()-st.since)/1000);let el=$('#session-timer');if(el)el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
setInterval(renderTime,1000);render();renderTime();
</script>
</body>
